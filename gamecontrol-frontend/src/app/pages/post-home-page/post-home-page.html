<main class="max-w-3xl mx-auto px-4 py-6 text-white">
  <section class="bg-slate-900/90 border border-cyan-500/20 rounded-xl shadow-lg overflow-hidden">
    <header class="px-5 py-4 border-b border-cyan-500/15">
      <h1 class="text-xl font-bold text-white">Feed geral</h1>
      <p class="text-sm text-gray-400">Veja os posts recentes dos usuários que você segue.</p>
    </header>

    <form class="px-5 py-4 border-b border-cyan-500/15" (ngSubmit)="publicar()">
      <textarea
        name="textoCriacaoDoPost"
        [ngModel]="textoCriacaoDoPost"
        (ngModelChange)="onDraftChange($event)"
        rows="3"
        placeholder="O que está rolando no seu universo gamer?"
        class="w-full bg-slate-950/70 border border-cyan-500/20 rounded-lg px-4 py-3 text-sm text-white placeholder:text-gray-500 outline-none focus:border-pink-500/70 focus:ring-1 focus:ring-pink-500/50 transition resize-none"
      ></textarea>

      <div class="mt-3 flex items-center justify-between">
        <span class="text-xs" [ngClass]="restantes < 20 ? 'text-red-400' : 'text-gray-400'">
          {{ restantes }}
        </span>

        <button
          type="submit"
          [disabled]="!textoCriacaoDoPost.trim()"
          class="inline-flex items-center rounded-lg bg-pink-500 px-4 py-2 text-sm font-semibold text-white shadow-[0_0_12px_#EB479966,0_0_24px_#EB479944] hover:bg-pink-600 transition disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
        >
          <svg lucideSend class="w-4 h-4 mr-2"></svg>
          Postar
        </button>
      </div>
    </form>

    <div *ngIf="carregando" class="px-5 py-8 text-center text-gray-400">Carregando posts...</div>

    <ul *ngIf="!carregando" class="divide-y divide-cyan-500/10">
      <li
        *ngFor="let post of posts; trackBy: trackByPostId"
        class="px-5 py-4 hover:bg-white/[0.03] transition-colors"
      >
        <div class="flex gap-3">
          <div
            class="w-10 h-10 rounded-full bg-slate-950 flex items-center justify-center ring-1 ring-cyan-500/20 shrink-0"
          >
            <svg lucideUserRound class="w-5 h-5 text-cyan-500/80"></svg>
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 text-sm flex-wrap">
              <a
                [routerLink]="['/user', post.userId]"
                class="font-semibold text-white truncate hover:text-pink-500 transition-colors cursor-pointer"
              >
                {{ post.username || 'Usuário' }}
              </a>

              <span class="text-gray-500"> · {{ timeAgo(post.createdAt) }} </span>
            </div>

            <p class="mt-1 text-sm text-gray-100 whitespace-pre-wrap leading-relaxed">
              {{ post.text }}
            </p>

            <div class="flex items-center justify-start mt-3 gap-5 text-gray-400">
              <button
                type="button"
                class="group flex items-center gap-1 text-xs hover:text-cyan-300 transition-colors"
                (click)="comentariosEmBreve()"
              >
                <span class="p-1.5 rounded-full group-hover:bg-cyan-500/10">
                  <svg lucideMessageCircle class="w-4 h-4"></svg>
                </span>

                {{ quantidadeComentarios(post) }}
              </button>

              <button
                type="button"
                class="group flex items-center gap-1 text-xs hover:text-pink-400 transition-colors"
                (click)="toggleLikeLocal(post)"
              >
                <span class="p-1.5 rounded-full group-hover:bg-pink-500/10">
                  <svg lucideHeart class="w-4 h-4"></svg>
                </span>

                {{ post.likes || 0 }}
              </button>

              <button
                *ngIf="podeDeletar(post)"
                type="button"
                class="group flex items-center gap-1 text-xs hover:text-red-400 transition-colors"
                (click)="deletarPost(post.id)"
              >
                <span class="p-1.5 rounded-full group-hover:bg-red-500/10">
                  <svg lucideTrash2 class="w-4 h-4"></svg>
                </span>

                Excluir
              </button>
            </div>
          </div>
        </div>
      </li>

      <li *ngIf="posts.length === 0" class="px-5 py-8 text-center text-gray-400">
        Nenhum post encontrado. Siga outros usuários para ver publicações aqui.
      </li>
    </ul>
  </section>
</main>
