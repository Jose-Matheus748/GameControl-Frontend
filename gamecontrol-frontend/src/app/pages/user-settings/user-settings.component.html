<div
  *ngIf="loading"
  class="w-full min-h-screen bg-slate-950 px-4 md:px-8 py-8 animate-pulse"
>
  <div class="space-y-4">
    <div class="h-8 bg-slate-800 rounded"></div>
    <div class="h-12 bg-slate-800 rounded"></div>
    <div class="h-24 bg-slate-800 rounded"></div>
  </div>
</div>

<div
  *ngIf="!loading"
  class="w-full min-h-screen bg-slate-950 text-white px-4 md:px-8 py-8"
>
  <section
    *ngIf="!loading"
    class="w-full bg-slate-900/90 border border-cyan-500/20 rounded-2xl p-6 md:p-8 shadow-lg"
  >
    <!-- Título -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-pink-500">
        Configurações do Perfil
      </h1>
      <p class="text-gray-400 mt-1">
        Personalize suas informações no GameControl
      </p>
    </div>

    <!-- Foto de perfil -->
    <div class="mb-8 flex flex-col items-center text-center">
      <label class="block mb-3 text-sm text-gray-300">
        Foto de perfil
      </label>

      <label
        for="profileUpload"
        class="cursor-pointer inline-block group"
      >
        <img
          *ngIf="previewUrl || userData.profilePictureUrl; else defaultAvatar"
          [src]="previewUrl || userData.profilePictureUrl"
          alt="avatar"
          class="w-28 h-28 rounded-full object-cover
                 shadow-[0_0_20px_#EB479933]
                 ring-2 ring-cyan-500/20
                 transition-all
                 group-hover:ring-pink-500"
        />

        <ng-template #defaultAvatar>
          <div
            class="w-28 h-28 rounded-full bg-slate-800
                   flex items-center justify-center
                   shadow-[0_0_20px_#EB479933]
                   ring-2 ring-cyan-500/20
                   group-hover:ring-pink-500
                   transition-all"
          >
            <svg
              lucideUserRound
              class="w-12 h-12 text-cyan-400"
            ></svg>
          </div>
        </ng-template>
      </label>

      <input
        id="profileUpload"
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onImageSelected($event)"
      />

      <p class="text-xs text-gray-500 mt-3">
        Clique na imagem para alterar
      </p>
    </div>

    <!-- Formulário -->
    <div class="grid grid-cols-1 gap-6">
      <!-- Nome -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">
          Nome de usuário
        </label>
        <input
          [(ngModel)]="userData.username"
          class="w-full px-4 py-3 rounded-xl bg-slate-800
                 border border-cyan-500/20
                 focus:outline-none
                 focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Bio -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">
          Bio
        </label>
        <textarea
          [(ngModel)]="userData.bio"
          rows="4"
          class="w-full px-4 py-3 rounded-xl bg-slate-800
                 border border-pink-500/20
                 focus:outline-none
                 focus:ring-2 focus:ring-pink-400"
        ></textarea>
      </div>

      <!-- País -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">
          País
        </label>
        <input
          [(ngModel)]="userData.country"
          class="w-full px-4 py-3 rounded-xl bg-slate-800
                 border border-cyan-500/20
                 focus:outline-none
                 focus:ring-2 focus:ring-cyan-400"
        />
      </div>
    </div>

    <!-- Botões -->
    <div class="mt-8 flex flex-col gap-4">
      <button
        (click)="saveChanges()"
        class="w-full bg-pink-500 hover:bg-pink-600
               transition-all duration-300
               rounded-xl py-3 font-semibold
               shadow-lg shadow-pink-500/30"
      >
        Salvar alterações
      </button>

      <button
        (click)="logout()"
        class="w-full flex items-center justify-center gap-2
               py-3 rounded-xl
               bg-red-500 hover:bg-red-600
               transition-all duration-300
               font-semibold shadow-lg shadow-red-500/20"
      >
        <svg lucideDoorOpen class="w-5 h-5"></svg>
        Logout
      </button>
    </div>
  </section>
</div>
