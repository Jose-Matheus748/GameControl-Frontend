<div *ngIf="loading" class="text-center py-16 text-cyan-400 text-2xl">
  Carregando avaliações...
</div>

<div *ngIf="!loading && game" class="bg-[#050816] min-h-screen text-white p-8">

  <!-- GAME INFO -->
  <h1 (click)="goToGame()"
      class="text-4xl md:text-5xl font-orbitron font-bold text-white leading-tight
             drop-shadow-[0_0_20px_rgba(34,211,238,0.5)]
             cursor-pointer hover:text-cyan-400 transition-colors duration-200
             hover:drop-shadow-[0_0_25px_rgba(34,211,238,0.8)]">
    {{ game.title }}
  </h1>

  <div class="flex items-center gap-2 mb-6">
    <span *ngFor="let s of [1,2,3,4,5]; let i = index"
          class="text-3xl"
          [class.text-yellow-400]="i < averageRating"
          [class.text-gray-700]="i >= averageRating">
      ★
    </span>

    <span class="ml-2 text-xl text-gray-400">
      {{ displayRating }}/5
    </span>
  </div>

  <!-- NÃO TEM REVIEW -->
  <div *ngIf="!userReview" class="bg-slate-900 p-5 rounded-xl mb-8">

    <h2 class="text-xl mb-3">Sua avaliação</h2>

    <div class="flex gap-2 mb-3">
      <span *ngFor="let s of [1,2,3,4,5]; let i = index"
            (click)="newRating = i + 1"
            class="cursor-pointer text-3xl"
            [class.text-yellow-400]="i < newRating"
            [class.text-gray-700]="i >= newRating">
        ★
      </span>
    </div>

    <textarea [(ngModel)]="newComment"
              class="w-full p-3 bg-slate-800 rounded-lg"
              placeholder="Escreva sua avaliação..."></textarea>

    <button (click)="submitReview()"
            [disabled]="newRating === 0"
            class="mt-3 bg-pink-500 px-4 py-2 rounded-lg">
      Enviar avaliação
    </button>
  </div>

  <!-- TEM REVIEW -->
  <div *ngIf="userReview && !editing" class="bg-slate-900 p-5 rounded-xl mb-8">

    <h2 class="text-xl mb-3">Sua avaliação</h2>

    <div class="flex justify-between items-center">
      <div>
        <div>
          <span *ngFor="let s of [1,2,3,4,5]; let i = index"
                class="text-xl"
                [class.text-yellow-400]="i < userReview.rating"
                [class.text-gray-700]="i >= userReview.rating">
            ★
          </span>
        </div>

        <p class="text-gray-300 mt-2">
          {{ userReview.description }}
        </p>
      </div>

      <div class="flex gap-2">
        <button (click)="startEdit()"
                title="Editar avaliação"
                class="w-9 h-9 flex items-center justify-center rounded-lg
                       border border-yellow-500/40 text-yellow-400
                       hover:bg-yellow-500/10 hover:border-yellow-400
                       hover:shadow-[0_0_12px_rgba(234,179,8,0.4)]
                       transition-all duration-200">
          <!-- ícone lápis -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>

        <button (click)="deleteReview(userReview.id!)"
                title="Deletar avaliação"
                class="w-9 h-9 flex items-center justify-center rounded-lg
                       border border-pink-500/40 text-pink-400
                       hover:bg-pink-500/10 hover:border-pink-400
                       hover:shadow-[0_0_12px_rgba(236,72,153,0.4)]
                       transition-all duration-200">
          <!-- ícone lixeira -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- EDITANDO -->
  <div *ngIf="editing" class="bg-slate-900 p-5 rounded-xl mb-8">

    <h2 class="text-xl mb-3">Editar avaliação</h2>

    <div class="flex gap-2 mb-3">
      <span *ngFor="let s of [1,2,3,4,5]; let i = index"
            (click)="newRating = i + 1"
            class="cursor-pointer text-3xl"
            [class.text-yellow-400]="i < newRating"
            [class.text-gray-700]="i >= newRating">
        ★
      </span>
    </div>

    <textarea [(ngModel)]="newComment"
              class="w-full p-3 bg-slate-800 rounded-lg"></textarea>

    <div class="flex gap-2 mt-3">
      <button (click)="submitReview()"
              class="bg-pink-500 px-4 py-2 rounded-lg">
        Salvar
      </button>

      <button (click)="editing = false"
              class="bg-gray-600 px-4 py-2 rounded-lg">
        Cancelar
      </button>
    </div>
  </div>

  <!-- LISTA -->
  <div *ngFor="let review of reviews"
       class="bg-slate-900 p-4 rounded-xl mb-4">

    <div class="flex justify-between mb-2">
      <a [routerLink]="['/profile', review.userId]"
         class="text-pink-400 font-bold hover:text-pink-300 hover:underline transition-colors duration-200 cursor-pointer">
        {{ review.userName }}
      </a>
      <span class="text-gray-400 text-sm">
        {{ review.createdAt | date:'short' }}
      </span>
    </div>

    <div class="mb-2">
      <span *ngFor="let s of [1,2,3,4,5]; let i = index"
            class="text-xl"
            [class.text-yellow-400]="i < review.rating"
            [class.text-gray-700]="i >= review.rating">
        ★
      </span>
    </div>

    <p class="text-gray-300">
      {{ review.description }}
    </p>
  </div>

</div>
