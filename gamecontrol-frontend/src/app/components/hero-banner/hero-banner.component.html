<div class="relative w-full h-[420px] md:h-[500px] overflow-hidden">
  <div
    class="absolute inset-0 z-0 will-change-transform"
    [style.transform]="'translateY(' + parallaxOffset + 'px)'"
  >
    <img
      *ngFor="let slide of slides; let i = index"
      [src]="slide.image"
      class="absolute inset-0 h-full w-full object-cover object-center"
      [ngClass]="i === currentSlide ? 'opacity-100' : 'opacity-0'"
      alt="Banner de jogos"
    />
  </div>

  <div
    class="absolute inset-0 z-10"
    [ngClass]="slides[currentSlide].overlayClass"
  ></div>

  <div
    class="absolute inset-0 bg-black pointer-events-none transition-opacity ease-in-out"
    [style.opacity]="isBlackout ? 1 : 0"
    [style.transition-duration]="TRANSITION_DURATION + 'ms'"
    style="z-index: 50;"
  ></div>

  <div class="font-orbitron absolute inset-0 z-20 flex flex-col justify-center px-6 md:px-20">

    <div
      *ngIf="slides[currentSlide].badge"
      class="mb-3 inline-flex items-center gap-2 w-fit bg-white/10 border border-white/20 text-white text-sm font-semibold px-4 py-1.5 rounded-full backdrop-blur-sm"
    >
      {{ slides[currentSlide].badge }}
    </div>

    <h1 class="text-4xl md:text-6xl font-extrabold mb-4 leading-tight">
      <span *ngIf="slides[currentSlide].titleWhite" class="text-white">
        {{ slides[currentSlide].titleWhite }}<br />
      </span>
      <span [ngClass]="slides[currentSlide].titleColoredClass">
        {{ slides[currentSlide].titleColored }}
      </span>
    </h1>

    <p class="text-lg md:text-xl text-gray-300 max-w-xl mb-8">
      {{ slides[currentSlide].subtitle }}
    </p>

      <a [routerLink]="slides[currentSlide].ctaLink"
      class="max-w-xs w-full inline-block text-center bg-pink-500 text-white font-bold py-3 px-14 rounded-lg text-lg hover:scale-105 transition-all duration-300 shadow-lg shadow-pink-500/30"
    >
      {{ slides[currentSlide].ctaLabel }}
    </a>
  </div>

  <button
    type="button"
    (click)="previousSlide()"
    class="absolute left-4 top-1/2 z-30 -translate-y-1/2 bg-black/50 text-white px-4 py-2 rounded-lg hover:bg-black/70 transition-colors"
  >
    ‹
  </button>

  <button
    type="button"
    (click)="nextSlide()"
    class="absolute right-4 top-1/2 z-30 -translate-y-1/2 bg-black/50 text-white px-4 py-2 rounded-lg hover:bg-black/70 transition-colors"
  >
    ›
  </button>

  <div class="absolute bottom-5 left-1/2 z-30 flex -translate-x-1/2 gap-2">
    <button
      *ngFor="let slide of slides; let i = index"
      type="button"
      (click)="goToSlide(i)"
      class="h-3 rounded-full transition-all duration-500 ease-out"
      [ngClass]="
        i === currentSlide
          ? 'w-8 bg-pink-500 shadow-[0_0_14px_rgba(236,72,153,0.9)]'
          : 'w-3 bg-white/50 hover:bg-white/80'
      "
    ></button>
  </div>

</div>
