<div
  class="bg-slate-900/90 border border-cyan-500/20 text-white rounded-xl shadow-lg overflow-hidden h-full"
>
  <!-- Cabeçalho -->
  <div class="flex items-center gap-3 px-5 py-4 border-b border-cyan-500/15">
    <div
      class="w-9 h-9 rounded-full bg-pink-500/15 flex items-center justify-center ring-1 ring-pink-500/40"
    >
      <svg lucideSparkles class="w-4 h-4 text-pink-400"></svg>
    </div>

    <div>
      <h2 class="font-semibold text-white">Feed do jogador</h2>

      <p class="text-xs text-gray-400">Compartilhe suas conquistas e opiniões</p>
    </div>
  </div>

  <!-- Criador de post -->
  <form class="px-5 py-4 border-b border-cyan-500/15" (ngSubmit)="publicar()">
    <div class="flex gap-3">
      <div class="shrink-0">
        <img
          *ngIf="user?.profilePictureUrl; else defaultComposerAvatar"
          [src]="user?.profilePictureUrl"
          alt="avatar"
          class="w-10 h-10 rounded-full object-cover ring-1 ring-cyan-500/30"
        />

        <ng-template #defaultComposerAvatar>
          <div
            class="w-10 h-10 rounded-full bg-slate-950 flex items-center justify-center ring-1 ring-cyan-500/30"
          >
            <svg lucideUserRound class="w-5 h-5 text-cyan-500/80"></svg>
          </div>
        </ng-template>
      </div>

      <div class="flex-1 min-w-0">
        <textarea
          name="draft"
          [ngModel]="textoCriacaoDoPost"
          (ngModelChange)="onDraftChange($event)"
          rows="2"
          placeholder="O que está rolando no seu universo gamer?"
          class="w-full bg-transparent border-0 resize-none outline-none text-sm placeholder:text-gray-500 text-white"
        ></textarea>

        <div
          *ngIf="attachedImage"
          class="relative mt-2 rounded-lg overflow-hidden border border-cyan-500/20"
        >
          <img [src]="attachedImage" alt="anexo" class="w-full max-h-64 object-cover" />

          <button
            type="button"
            class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/70 text-white text-xs hover:bg-black transition"
            (click)="removeAttachedImage()"
            aria-label="Remover imagem"
          >
            ×
          </button>
        </div>

        <div class="flex items-center justify-between mt-2">
          <button
            type="button"
            class="flex items-center gap-1.5 text-pink-400 hover:text-pink-300 text-sm transition-colors"
            (click)="fakeAttach()"
          >
            <svg lucideImagePlus class="w-4 h-4"></svg>
            <span>Imagem</span>
          </button>

          <div class="flex items-center gap-3">
            <span class="text-xs" [ngClass]="restantes < 20 ? 'text-red-400' : 'text-gray-400'">
              {{ restantes }}
            </span>

            <button
              type="submit"
              [disabled]="!textoCriacaoDoPost.trim()"
              class="px-4 py-1.5 rounded-full bg-pink-500 text-white text-sm font-semibold shadow-[0_0_12px_#EB479966,0_0_24px_#EB479944] hover:shadow-[0_0_16px_#EB4799AA,0_0_28px_#EB479988] transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
            >
              Postar
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>

  <!-- Lista de posts -->
  <ul class="divide-y divide-cyan-500/10 max-h-[640px] overflow-y-auto">
    <li
      *ngFor="let post of posts; trackBy: trackByPostId"
      class="px-5 py-4 hover:bg-white/[0.03] transition-colors"
    >
      <div class="flex gap-3">
        <div class="shrink-0">
          <img
            *ngIf="user?.profilePictureUrl; else defaultPostAvatar"
            [src]="user?.profilePictureUrl"
            alt="avatar"
            class="w-10 h-10 rounded-full object-cover ring-1 ring-cyan-500/20"
          />

          <ng-template #defaultPostAvatar>
            <div
              class="w-10 h-10 rounded-full bg-slate-950 flex items-center justify-center ring-1 ring-cyan-500/20"
            >
              <svg lucideUserRound class="w-5 h-5 text-cyan-500/80"></svg>
            </div>
          </ng-template>
        </div>

        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 text-sm flex-wrap">
            <span class="font-semibold text-white truncate">
              {{ username }}
            </span>

            <span class="text-gray-500"> @{{ userHandle }} </span>

            <span class="text-gray-500">·</span>

            <span class="text-gray-500">
              {{ timeAgo(post.createdAt) }}
            </span>
          </div>

          <p class="mt-1 text-sm text-gray-100 whitespace-pre-wrap leading-relaxed">
            {{ post.content }}
          </p>

          <span
            *ngIf="post.game"
            class="inline-flex items-center gap-1 mt-2 px-2 py-0.5 rounded-full bg-pink-500/15 text-pink-300 text-xs font-medium border border-pink-500/30"
          >
            🎮 {{ post.game }}
          </span>

          <div
            *ngIf="post.imageUrl"
            class="mt-3 rounded-xl overflow-hidden border border-cyan-500/20"
          >
            <img [src]="post.imageUrl" alt="" class="w-full max-h-80 object-cover" />
          </div>

          <div class="flex items-center justify-between mt-3 max-w-md text-gray-400">
            <button
              type="button"
              class="group flex items-center gap-1.5 text-xs hover:text-cyan-300 transition-colors"
              (click)="comentariosEmBreve()"
            >
              <span class="p-1.5 rounded-full group-hover:bg-cyan-500/10">
                <svg lucideMessageCircle class="w-4 h-4"></svg>
              </span>
              {{ post.comments }}
            </button>

            <button
              type="button"
              class="group flex items-center gap-1.5 text-xs hover:text-cyan-300 transition-colors"
              (click)="repostar()"
            >
              <span class="p-1.5 rounded-full group-hover:bg-cyan-500/10">
                <svg lucideRepeat2 class="w-4 h-4"></svg>
              </span>
              {{ post.reposts }}
            </button>

            <button
              type="button"
              class="group flex items-center gap-1.5 text-xs transition-colors"
              [ngClass]="post.liked ? 'text-pink-400' : 'text-gray-400 hover:text-pink-400'"
              (click)="toggleLike(post.id)"
            >
              <span class="p-1.5 rounded-full group-hover:bg-pink-500/10">
                <svg lucideHeart class="w-4 h-4" [ngClass]="post.liked ? 'fill-current' : ''"></svg>
              </span>
              {{ post.likes }}
            </button>

            <button
              type="button"
              class="group flex items-center gap-1.5 text-xs hover:text-cyan-300 transition-colors"
              (click)="compartilhar()"
            >
              <span class="p-1.5 rounded-full group-hover:bg-cyan-500/10">
                <svg lucideShare2 class="w-4 h-4"></svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </li>
  </ul>
</div>
