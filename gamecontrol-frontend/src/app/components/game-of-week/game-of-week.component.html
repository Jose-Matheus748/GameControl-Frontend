<!-- LOADING -->
<div *ngIf="!game" class="text-center py-10 text-cyan-400 font-orbitron animate-pulse">
  Carregando...
</div>

<!-- CARD -->
<div *ngIf="game"
     class="relative max-w-7xl mx-auto my-6 rounded-xl overflow-hidden
            border border-cyan-500/20
            shadow-[0_0_30px_rgba(34,211,238,0.08)]">

  <!-- BACKGROUND: capa do jogo com blur + escurecimento -->
  <div class="absolute inset-0"
       [style.background-image]="'url(' + (game.coverImageUrl || 'assets/default-cover.jpg') + ')'"
       style="background-size: cover; background-position: center;">
  </div>
  <div class="absolute inset-0 bg-[#050816]/80 backdrop-blur-sm"></div>

  <!-- CONTEÚDO -->
  <div class="relative z-10 flex flex-col sm:flex-row gap-6 p-6 md:p-8">

    <!-- CAPA (pequena, proporção correta) -->
    <div class="flex-shrink-0 mx-auto sm:mx-0">
      <a [routerLink]="['/games', game.id]">
        <img
          [src]="game.coverImageUrl || 'assets/default-cover.jpg'"
          [alt]="game.title"
          class="w-36 md:w-44 aspect-[2/3] object-cover rounded-lg
                 shadow-[0_0_20px_rgba(236,72,153,0.3)]
                 hover:shadow-[0_0_30px_rgba(236,72,153,0.5)]
                 hover:scale-105 transition-all duration-300"
        />
      </a>
    </div>

    <!-- TEXTOS -->
    <div class="flex flex-col justify-between flex-1 min-w-0">
      <div>
        <!-- BADGE -->
        <p class="text-xs font-orbitron text-cyan-400 tracking-[0.3em] uppercase mb-2 opacity-80">
          jogo da semana
        </p>

        <h2 class="font-orbitron text-2xl md:text-3xl font-bold text-white mb-3 leading-tight">
          {{ game.title }}
        </h2>

        <p class="text-gray-300 text-sm leading-relaxed line-clamp-3 mb-4">
          {{ game.description }}
        </p>

        <!-- ESTRELAS -->
        <div class="flex items-center gap-1 mb-2">
          <ng-container *ngFor="let filled of stars">
            <svg *ngIf="filled" class="w-5 h-5 text-yellow-400 drop-shadow-[0_0_4px_rgba(250,204,21,0.7)]"
                 fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.151c.969 0 1.371 1.24.588 1.81l-3.36 2.44a1 1 0 00-.364 1.118l1.287 3.954c.3.921-.755 1.688-1.538 1.118l-3.36-2.44a1 1 0 00-1.175 0l-3.36 2.44c-.783.57-1.838-.197-1.538-1.118l1.287-3.954a1 1 0 00-.364-1.118l-3.36-2.44c-.783-.57-.38-1.81.588-1.81h4.15a1 1 0 00.951-.69l1.287-3.955z"/>
            </svg>
            <svg *ngIf="!filled" class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.151c.969 0 1.371 1.24.588 1.81l-3.36 2.44a1 1 0 00-.364 1.118l1.287 3.954c.3.921-.755 1.688-1.538 1.118l-3.36-2.44a1 1 0 00-1.175 0l-3.36 2.44c-.783.57-1.838-.197-1.538-1.118l1.287-3.954a1 1 0 00-.364-1.118l-3.36-2.44c-.783-.57-.38-1.81.588-1.81h4.15a1 1 0 00.951-.69l1.287-3.955z"/>
            </svg>
          </ng-container>
          <span class="text-gray-400 text-sm ml-1">{{ averageRating }}/5</span>
        </div>
      </div>

      <!-- BOTÃO -->
      <div class="mt-4">
        <a [routerLink]="['/games', game.id]"
           class="font-orbitron inline-block text-sm tracking-wider uppercase
                  bg-pink-500 hover:bg-pink-400 text-white
                  py-2 px-6 rounded-lg
                  shadow-[0_0_15px_rgba(236,72,153,0.4)]
                  hover:shadow-[0_0_25px_rgba(236,72,153,0.7)]
                  transition-all duration-200">
          Visualizar Jogo
        </a>
      </div>
    </div>
  </div>
</div>
