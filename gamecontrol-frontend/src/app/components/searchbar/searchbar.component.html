<div class="relative w-full max-w-xl mx-auto">
  <input
    type="text"
    placeholder="Buscar jogos..."
    [(ngModel)]="searchTerm"
    (input)="onInputChange()"
    (keydown.enter)="onEnterSearch()"
    class="w-full bg-[#111827] border border-gray-700/80 text-white rounded-2xl
           pl-12 pr-5 py-3
           shadow-lg shadow-pink-500/10
           focus:outline-none focus:ring-2 focus:ring-pink-500
           focus:border-pink-500
           transition-all duration-300
           placeholder-gray-400 font-orbitron"
  />

  <svg
    class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-pink-500"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"
    />
  </svg>
</div>
