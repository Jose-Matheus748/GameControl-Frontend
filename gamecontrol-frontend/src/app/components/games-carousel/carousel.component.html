<section *ngIf="gameCards.length > 0" class="relative max-w-7xl mx-auto px-4 py-8">

  <!-- Cabeçalho da seção -->
  <div class="flex items-center justify-between mb-6 px-1">
    <div class="flex items-center gap-3">
      <div class="w-1 h-6 rounded-full bg-gradient-to-b from-cyan-400 to-pink-500"></div>
      <h2 class="font-orbitron text-lg font-bold text-white tracking-wide">Em Destaque</h2>
    </div>

    <!-- Indicadores de página -->
    <div class="flex items-center gap-1.5">
      <span
        *ngFor="let page of pageIndicators; let i = index"
        class="block rounded-full transition-all duration-300"
        [ngClass]="i === currentPage
          ? 'w-5 h-1.5 bg-pink-500 shadow-[0_0_6px_#EB4799]'
          : 'w-1.5 h-1.5 bg-slate-600 hover:bg-slate-400'"
      ></span>
    </div>
  </div>

  <!-- Área do carrossel -->
  <div class="relative flex items-center gap-3">

    <!-- Botão anterior -->
    <button
      (click)="prev()"
      [disabled]="index === 0"
      class="shrink-0 z-10 w-9 h-9 flex items-center justify-center rounded-full
             border border-cyan-500/20 bg-slate-900/80 text-cyan-400
             hover:border-pink-500/50 hover:text-pink-400 hover:bg-slate-800
             hover:shadow-[0_0_14px_#EB479944]
             disabled:opacity-25 disabled:cursor-not-allowed disabled:hover:shadow-none
             transition-all duration-200"
      aria-label="Anterior"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- Track -->
    <div class="overflow-hidden w-full">
      <div
        class="flex transition-transform duration-500 ease-in-out"
        [style.transform]="'translateX(-' + (index * 25) + '%)'"
      >
        <div
          *ngFor="let game of gameCards; let i = index"
          class="w-1/4 flex-shrink-0 px-2"
        >
          <a [routerLink]="'/game/' + game.id" class="group block">

            <!-- Card -->
            <div class="relative rounded-xl overflow-hidden
                        border border-cyan-500/10
                        shadow-[0_4px_20px_rgba(0,0,0,0.4)]
                        group-hover:border-pink-500/40
                        group-hover:shadow-[0_0_24px_rgba(236,72,153,0.2)]
                        transition-all duration-300">

              <!-- Capa -->
              <img
                [src]="getCoverUrl(game)"
                [alt]="game.title"
                class="w-full aspect-[2/3] object-cover
                       group-hover:scale-105
                       transition-transform duration-500 ease-out"
              />

              <!-- Gradiente inferior -->
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/20 to-transparent"></div>

              <!-- Brilho superior sutil no hover -->
              <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300
                          bg-gradient-to-br from-pink-500/8 via-transparent to-cyan-500/8"></div>

              <!-- Info na base do card -->
              <div class="absolute bottom-0 left-0 right-0 p-3">
                <h3 class="font-orbitron text-xs font-bold text-white truncate leading-tight
                           drop-shadow-[0_1px_4px_rgba(0,0,0,0.8)]
                           group-hover:text-pink-300 transition-colors duration-200">
                  {{ game.title }}
                </h3>

                <!-- Linha de acento decorativa -->
                <div class="mt-1.5 h-px w-0 group-hover:w-full bg-gradient-to-r from-pink-500 to-cyan-400
                            transition-all duration-300 ease-out rounded-full"></div>
              </div>

              <!-- Badge de número (index visível) -->
              <div class="absolute top-2 left-2 w-6 h-6 rounded-full bg-slate-950/70 border border-cyan-500/20
                          flex items-center justify-center
                          text-[10px] font-orbitron font-bold text-cyan-400
                          opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                {{ i + 1 }}
              </div>

            </div>

          </a>
        </div>
      </div>
    </div>

    <!-- Botão próximo -->
    <button
      (click)="next()"
      [disabled]="index + 4 >= gameCards.length"
      class="shrink-0 z-10 w-9 h-9 flex items-center justify-center rounded-full
             border border-cyan-500/20 bg-slate-900/80 text-cyan-400
             hover:border-pink-500/50 hover:text-pink-400 hover:bg-slate-800
             hover:shadow-[0_0_14px_#EB479944]
             disabled:opacity-25 disabled:cursor-not-allowed disabled:hover:shadow-none
             transition-all duration-200"
      aria-label="Próximo"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

  </div>
</section>

<!-- Loading state -->
<div *ngIf="loading && gameCards.length === 0"
     class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex items-center gap-3 mb-6 px-1">
    <div class="w-1 h-6 rounded-full bg-gradient-to-b from-cyan-400 to-pink-500"></div>
    <div class="h-4 w-32 bg-slate-800 rounded animate-pulse"></div>
  </div>
  <div class="flex gap-4">
    <div *ngFor="let _ of [1,2,3,4]"
         class="w-1/4 flex-shrink-0 aspect-[2/3] rounded-xl bg-slate-800/60 animate-pulse border border-cyan-500/10">
    </div>
  </div>
</div>
